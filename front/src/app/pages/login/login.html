<app-header />

<main class="auth-page">
  <app-back-button link="/" class="auth-page_back" />
  <img src="/images/logo_p6.png" alt="MDD" class="auth-page_logo" />

  <h1 class="auth-page_title">Se connecter</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
    <mat-form-field appearance="outline">
      <mat-label>E-mail ou nom d'utilisateur</mat-label>
      <input matInput formControlName="identifier" autocomplete="username" />
      @if (form.controls.identifier.hasError('required')) {
        <mat-error>L'e-mail ou le nom d'utilisateur est obligatoire</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.hasError('required')) {
        <mat-error>Le mot de passe est obligatoire</mat-error>
      }
    </mat-form-field>

    @if (errorMessage()) {
      <p class="auth-form_error" role="alert">{{ errorMessage() }}</p>
    }

    <button matButton="filled" type="submit" class="auth-form_submit" [disabled]="submitting()">
      Se connecter
    </button>
  </form>
</main>
