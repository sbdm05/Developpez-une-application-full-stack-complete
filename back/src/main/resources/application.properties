spring.application.name=mddapi
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mdd?serverTimezone=UTC
spring.datasource.username=${DB_USER:mdd_admin}
spring.datasource.password=${DB_PASSWORD:Admin_MDP!}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#clé secrete
app.jwt.secret=${JWT_SECRET:change-moi-avec-une-cle-longue-d-au-moins-32-caracteres}
#limite à 24h 
app.jwt.expiration-ms=86400000

#ici, on attend que les tables soient créees avant d'insert 
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

#configuration de spring security
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}